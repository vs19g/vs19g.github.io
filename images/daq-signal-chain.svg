<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>

  <!-- Boxes -->
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="90" width="170" height="80" rx="8" fill="#f4e9f7" stroke="#8e44ad" stroke-width="2"/>
    <text x="105" y="122" fill="#2b2b2b" font-weight="600">Detector</text>
    <text x="105" y="142" fill="#555" font-size="12">Prop. Counter /</text>
    <text x="105" y="157" fill="#555" font-size="12">Si Strip Array</text>

    <rect x="235" y="90" width="190" height="80" rx="8" fill="#eaf2fb" stroke="#2e75b6" stroke-width="2"/>
    <text x="330" y="115" fill="#2b2b2b" font-weight="600">CAEN Digitizer</text>
    <text x="330" y="135" fill="#555" font-size="12">V1740 / V1725</text>
    <text x="330" y="153" fill="#555" font-size="12">QDC / PHA firmware</text>

    <rect x="470" y="90" width="190" height="80" rx="8" fill="#eafbf0" stroke="#2e9e5b" stroke-width="2"/>
    <text x="565" y="115" fill="#2b2b2b" font-weight="600">DAQ Software</text>
    <text x="565" y="135" fill="#555" font-size="12">FSUDAQ / CoMPASS</text>
    <text x="565" y="153" fill="#555" font-size="12">trigger + event build</text>

    <rect x="705" y="90" width="175" height="80" rx="8" fill="#fdf3e3" stroke="#c78a1e" stroke-width="2"/>
    <text x="792" y="122" fill="#2b2b2b" font-weight="600">Analysis</text>
    <text x="792" y="142" fill="#555" font-size="12">ROOT</text>
    <text x="792" y="157" fill="#555" font-size="12">calibration / physics</text>
  </g>

  <!-- Arrows -->
  <line x1="190" y1="130" x2="230" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="425" y1="130" x2="465" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="130" x2="700" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Signal labels -->
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="210" y="115">analog</text>
    <text x="210" y="128">pulse</text>
    <text x="445" y="115">digitized</text>
    <text x="445" y="128">waveform</text>
    <text x="680" y="115">coincident</text>
    <text x="680" y="128">event data</text>
  </g>

  <text x="450" y="230" text-anchor="middle" font-size="13" fill="#333">Digital DAQ signal chain for the ANASEN active target</text>
</svg>
