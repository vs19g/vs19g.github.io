<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="340" fill="#ffffff"/>

  <!-- Sun rays -->
  <g stroke="#e8a33d" stroke-width="3">
    <line x1="150" y1="15" x2="150" y2="45"/>
    <line x1="200" y1="25" x2="180" y2="50"/>
    <line x1="250" y1="15" x2="250" y2="45"/>
    <line x1="300" y1="25" x2="290" y2="50"/>
    <line x1="100" y1="25" x2="120" y2="50"/>
  </g>
  <circle cx="200" cy="45" r="22" fill="#f4c25a"/>
  <text x="200" y="90" text-anchor="middle" font-size="13" fill="#555">Sunlight</text>

  <!-- Layers (side view) -->
  <g text-anchor="middle">
    <!-- Nanophotonic absorber -->
    <rect x="60" y="110" width="580" height="30" fill="#5b3a86" opacity="0.85"/>
    <text x="350" y="130" font-size="14" fill="#fff" font-weight="600">Nanophotonic Solar Absorber Layer</text>

    <!-- Hot side membrane -->
    <rect x="60" y="140" width="580" height="18" fill="#c0392b" opacity="0.85"/>
    <text x="350" y="153" font-size="11" fill="#fff">Hot side (feed water)</text>

    <!-- Bilayer membrane -->
    <rect x="60" y="158" width="580" height="26" fill="#7f8c8d" opacity="0.9"/>
    <text x="350" y="176" font-size="13" fill="#fff" font-weight="600">Bilayer Hydrophobic Membrane</text>

    <!-- Cold side -->
    <rect x="60" y="184" width="580" height="18" fill="#2e75b6" opacity="0.85"/>
    <text x="350" y="197" font-size="11" fill="#fff">Cold side (permeate)</text>

    <!-- Distillate reservoir -->
    <rect x="60" y="202" width="580" height="60" fill="#aed6f1" opacity="0.6"/>
    <text x="350" y="238" font-size="13" fill="#1b4f72" font-weight="600">Distillate (desalinated water)</text>
  </g>

  <!-- Vapor arrows through membrane -->
  <g stroke="#2b2b2b" stroke-width="2" marker-end="url(#arrow2)">
    <defs>
      <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L7,3 z" fill="#2b2b2b"/>
      </marker>
    </defs>
    <line x1="200" y1="150" x2="200" y2="195"/>
    <line x1="350" y1="150" x2="350" y2="195"/>
    <line x1="500" y1="150" x2="500" y2="195"/>
  </g>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#777">Vapor diffuses across the temperature gradient generated directly by solar absorption</text>

  <text x="350" y="325" text-anchor="middle" font-size="13" fill="#333">Nano-Photonics Enabled Solar Membrane Distillation (NESMD) &mdash; conceptual cross-section</text>
</svg>
